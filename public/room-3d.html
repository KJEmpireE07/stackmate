<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StackMate — Interactive 3D collaborative workspace for coding partners">
  <title>StackMate — Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/room-3d.css">
  <script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
</head>
<body>
  <main id="workspace">

    <!-- Loading overlay -->
    <div id="loading">
      <i></i>Building your workspace…
    </div>

    <!-- Top bar -->
    <header class="topbar">
      <a class="back" href="dashboard.html" aria-label="Back to dashboard">←</a>
      <div class="topbar-info">
        <p>COLLABORATIVE SPACE</p>
        <h1 id="room-name">Loading room…</h1>
        <small id="room-meta">Preparing members…</small>
      </div>
      <nav>
        <a id="chat-link" href="room-chat.html">💬 Open Chat</a>
        <button id="reset-camera">⟲ Reset View</button>
      </nav>
    </header>

    <!-- 3D Canvas -->
    <canvas id="scene" aria-label="Interactive 3D workspace. Drag to orbit and scroll to zoom."></canvas>

    <!-- Help hint -->
    <aside>
      <b>Explore the workspace</b>
      <span>🖱️ Drag to orbit · Scroll to zoom</span>
    </aside>

    <!-- Error display -->
    <div id="error" hidden></div>

  </main>
  <script type="module" src="js/room-3d.js"></script>
</body>
</html>
